</style><main id="art"></main><script>
const qs=new URLSearchParams(location.search),kind=qs.get('art')||'hero',a=document.getElementById('art'),base='../../docs/media/';
const brand=(dark=false)=>`<div class="brand"><img src="${base}icon-${dark?'dark':'light'}.png" alt="拾片图标"><div><strong>拾片</strong><small>截图 · 闪念</small></div></div>`;
const footer=(label)=>`<div class="foot">macOS 原生应用 · 本地保存 · 开源</div><div class="tiny">${label}</div>`;
if(kind==='hero'||kind==='social'){a.className=kind==='social'?'social':'';a.innerHTML=brand()+`<div class="copy"><div class="eyebrow">留住眼前，接着想。</div><h1>把截图与灵感，<br>挂在眼前。</h1><p>截图、闪念、待办与附件，<br>在一条轻轻摆动的挂绳上相遇。</p></div><img class="editor" src="${base}editor-light.png" alt="拾片真实图文闪念界面">`+(kind==='hero'?`<img class="rope" src="${base}rope-native.png" alt="真实截图和闪念挂绳">`:'')+footer('0.5.14');}
if(kind==='notes'){a.className='feature';a.innerHTML=`<div class="copy"><div class="eyebrow">记下内容，也留住上下文</div><h1>不只一张图。<br>还有你的想法。</h1><p>给参考图补一句理由，<br>把下一步写成可以勾选的待办。</p></div><img class="editor" src="${base}editor-light.png"><div class="detail"><b>文字 · 清单 · 图片 · 附件</b><span>内容自动保存至本机。<br>底部工具随手可用，让正文成为主角。</span></div>`+footer('真实原生界面 · 演示内容');}
if(kind==='library'){a.className='feature library';a.innerHTML=`<div class="copy"><div class="eyebrow">眼前的重点，有序的收藏</div><h1>挂在眼前，也收进记忆里。</h1><p>挂绳留给正在用的内容。全部闪念中可搜索、排序、取下、恢复与继续编辑。</p></div><img class="shot" src="${base}library-light.png">`+footer('真实原生界面 · 演示内容');}
if(kind==='dark'){a.className='feature dark';a.innerHTML=`<div class="copy"><div class="eyebrow">轻一点，静一点</div><h1>天色变了。<br>灵感还在。</h1><p>浅色、深色，或跟随系统。<br>纸张与图标，在应用内保持一致。</p></div><img class="editor" src="${base}editor-dark.png"><div class="detail"><b>六种轻柔纸色</b><span>云白、雾蓝、浅藤、烟粉、麦芽、浅石。<br>支持减少动态，让体验适合自己。</span></div>`+footer('Finder 静态图标使用浅色版');}
</script></html>
