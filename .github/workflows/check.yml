name: Source checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        env:
          CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/ModuleCache
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.build/ModuleCache
        run: swift test --disable-sandbox
      - name: Load standalone launch checker
        run: |
          git clone --quiet https://github.com/LeeYH95/github-product-launch.git "$RUNNER_TEMP/github-product-launch"
          git -C "$RUNNER_TEMP/github-product-launch" checkout --quiet 59f94604ebd7fce36e9bc1762d4b7bdd0ca55cdc
      - name: Launch materials
        run: python3 "$RUNNER_TEMP/github-product-launch/scripts/check_launch.py" --root .
